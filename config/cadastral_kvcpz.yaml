## Класифікатор видів цільового призначення земельних ділянок (КВЦПЗ)
## Базується на наказі Держкомзему №548 (23.07.2010), форма 6-зем.
## Використовується CadastralClassificationCatalog для перекладу
## коду <-> повна назва, а також для угруповання у бізнес-категорії
## (commercial / industrial / residential / agricultural / transport / ...).
##
## Бізнес-групи (`business_groups`) — це інтерпретаційна обгортка над офіційним
## класифікатором. Вона існує тільки для FLX-агента, щоб користувацький запит
## «склад або супермаркет» → набір КВЦПЗ-кодів без угадування на боці LLM.

business_groups:
  commercial:
    label: "Комерційна забудова (торгівля, харчування, побут, АЗС/СТО)"
    description: "Магазини, ТЦ, супермаркети, кафе/ресторани, побутове обслуговування, АЗС, СТО, дорожній сервіс."
    purpose_codes: ["03.07", "03.08", "03.09", "03.10", "03.13", "12.04", "12.11"]
    keywords: ["торгівл", "магазин", "супермаркет", "ТРЦ", "ТЦ", "АЗС", "СТО", "ресторан", "кафе", "готел", "побут"]
  industrial:
    label: "Промисловість, склади, виробництво"
    description: "Переробна/машинобудівна/добувна промисловість, будівельні організації, технічна інфраструктура, склади виробничого призначення."
    purpose_codes: ["11.01", "11.02", "11.03", "11.04", "11.05"]
    keywords: ["промислов", "виробництв", "склад", "цех", "завод", "видобу", "переробк"]
  residential:
    label: "Житлова забудова"
    description: "Приватні будинки, багатоповерхівки, тимчасове проживання, гаражні кооперативи."
    purpose_codes: ["02.01", "02.02", "02.03", "02.04", "02.05", "02.06", "02.07", "02.08"]
    keywords: ["житлов", "будинк", "багатоквартир", "гараж"]
  agricultural:
    label: "Сільське господарство"
    description: "Товарне с/г, фермерство, городництво, садівництво, сінокоси."
    purpose_codes: ["01.01", "01.02", "01.03", "01.04", "01.05", "01.06", "01.07", "01.08", "01.09", "01.10", "01.11", "01.12", "01.13", "01.14"]
    keywords: ["сільськ", "фермерськ", "ОСГ", "садівниц", "город", "сінокос"]
  public_service:
    label: "Громадська забудова (адмін/освіта/медицина/наука)"
    description: "Органи влади, освіта, охорона здоров'я, релігійні/громадські, культура, наука, комунальне і побутове обслуговування, ДСНС."
    purpose_codes: ["03.01", "03.02", "03.03", "03.04", "03.05", "03.06", "03.11", "03.12", "03.14", "03.15", "03.16"]
    keywords: ["освіт", "школ", "медичн", "лікарн", "наук", "адміністрат", "комунальн"]
  transport:
    label: "Транспортна інфраструктура (без АЗС/СТО)"
    description: "Залізничний, морський, річковий, авіаційний, міський електротранспорт, трубопроводи, додаткові послуги."
    purpose_codes: ["12.01", "12.02", "12.03", "12.05", "12.06", "12.07", "12.08", "12.09", "12.10"]
    keywords: ["залізн", "морськ", "річков", "авіац", "трубопровід"]
  energy_comms:
    label: "Енергетика та зв'язок"
    description: "Землі енергетики, зв'язку (мережі, генерація, передача)."
    purpose_codes: ["13", "14"]
    keywords: ["енергет", "зв'язк", "ЛЕП", "підстанц"]
  recreation:
    label: "Рекреація та природно-заповідні землі"
    description: "Природно-заповідний фонд, природоохоронні, оздоровчі, рекреаційні землі."
    purpose_codes: ["04", "05", "06", "07"]
    keywords: ["рекреац", "заповід", "оздоровч"]
  cultural:
    label: "Історико-культурне призначення"
    purpose_codes: ["08"]
    keywords: ["історич", "культурн", "пам'ятк"]
  forestry:
    label: "Лісогосподарське призначення"
    purpose_codes: ["09"]
    keywords: ["ліс", "лісогосподар"]
  water:
    label: "Водний фонд"
    purpose_codes: ["10"]
    keywords: ["водн"]
  defence:
    label: "Оборона"
    purpose_codes: ["15"]
    keywords: ["оборон", "військов"]
  reserve:
    label: "Землі запасу та резервного фонду"
    purpose_codes: ["16", "17"]
    keywords: ["запас", "резервн"]
  common_use:
    label: "Землі загального користування"
    purpose_codes: ["18"]
    keywords: ["загальн", "сквер", "парк"]

