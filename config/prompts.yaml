      }}
      All free-text values must be in Ukrainian. Numbers — without thousand separators. Do not invent listings or links: only what is in evidence.

  investigator_lessons_query:
    template: |
      Build a short natural-language search query (Ukrainian, max 120 chars) to retrieve past investigations relevant to the new query. Return ONLY the plain text, without JSON or quotes.
      Bias the query toward Ukrainian real-estate market, demographic, or socio-economic investigation keywords when the new query is about property/location (unless the new query is purely technical/non-market).

      New user query: {user_query}

  listing_analytics:
    template: |
      Write a short analytical summary of the real‑estate listing **in Ukrainian**. The result is a ready‑to‑display text (без службових заголовків на кшталт “Ціна:”).

      Listing data: {context}
      Market context (use it to compare price): {analytics_context}

      Structure your answer як **три абзаци по 2–3 речення**:
      (1) Ціна – порівняй з ринковим контекстом (кількість оголошень, середня ціна за м²/га, індикатор ціни).
      (2) Місцезнаходження – опиши локацію, доступність, транспорт, базову інфраструктуру.
      (3) Оточення – тип забудови, сусідні об’єкти, характер району за описом.
      Пиши стисло, не повторюй очевидні факти з заголовка та опису.
