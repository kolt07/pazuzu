# Офіційний конфіг RabbitMQ (образ rabbitmq:4-management).
#
# За замовчуванням (з 3.12+) брокер закриває канал, якщо споживач не надіслав ACK
# за consumer_timeout — для Celery з task_acks_late це означає «задача довша за таймаут».
# Джерело: https://www.rabbitmq.com/docs/consumers#acknowledgement-timeout
#
# Значення в мілісекундах. 86400000 = 24 год.
consumer_timeout = 86400000

# RabbitMQ 4.3+: за замовчуванням заборонені transient non-exclusive черги.
# Старий Celery/Kombu (pidbox, rpc://) оголошує саме такі — без permit воркер
# падає з INTERNAL_ERROR Feature `transient_nonexcl_queues`.
# Правильний шлях: Celery >=5.6 з control_queue_exclusive / event_queue_exclusive.
# Цей permit — сумісність, поки всі клієнти оновлені; фічу приберуть у наступних major.
# https://www.rabbitmq.com/blog/2021/08/21/4.0-deprecation-announcements
deprecated_features.permit.transient_nonexcl_queues = true
