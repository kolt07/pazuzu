# Конфіг полів пошуку для сторінки пошуку та звітів.
# Використовується для побудови фільтрів (елемент = поле + тип порівняння + значення).
# value_type визначає доступні оператори порівняння.

collections:
  unified_listings:
    description: "Поля для пошуку в зведених оголошеннях"
    fields:
      status:
        label_uk: "Активність"
        value_type: "string"
        allowed_operators: [eq, ne, in, nin]
      source:
        label_uk: "Джерело"
        value_type: "string"
        allowed_operators: [eq, ne, in, nin]
      source_updated_at:
        label_uk: "Дата в джерелі"
        value_type: "date"
        allowed_operators: [eq, gte, lte, gt, lt]
      property_type:
        label_uk: "Тип оголошення"
        value_type: "string"
        allowed_operators: [eq, ne, in, nin]
      title:
        label_uk: "Заголовок"
        value_type: "string"
        allowed_operators: [eq, contains, not_contains, filled, empty]
      description:
        label_uk: "Опис"
        value_type: "string"
        allowed_operators: [contains, not_contains, filled, empty]
      price_uah:
        label_uk: "Ціна, грн"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      price_usd:
        label_uk: "Ціна, USD"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      building_area_sqm:
        label_uk: "Площа нерухомості, м²"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      land_area_sotky:
        label_uk: "Площа землі, с"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      land_area_ha:
        label_uk: "Площа землі, га (конвертація в с)"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      price_per_m2_uah:
        label_uk: "Ціна за м², грн"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      price_per_m2_usd:
        label_uk: "Ціна за м², USD"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      price_per_ha_uah:
        label_uk: "Ціна за сотку, грн"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      price_per_ha_usd:
        label_uk: "Ціна за сотку, USD"
        value_type: "number"
        allowed_operators: [eq, gte, lte, gt, lt]
      # Критерії НП (лише для парсингу рядка; у конструкторі — гео-типи нижче)
      settlement_population:
        label_uk: "Населення НП, осіб"
        value_type: "number"
        allowed_operators: [gte, lte, gt, lt]
        builder_hidden: true
      settlement_area_sq_km:
        label_uk: "Площа НП, км²"
        value_type: "number"
        allowed_operators: [gte, lte, gt, lt]
        builder_hidden: true
      settlement_region_context:
        label_uk: "Область (контекст НП)"
        value_type: "string"
        allowed_operators: [eq]
        builder_hidden: true
      settlement_name_context:
        label_uk: "Назва НП (контекст)"
        value_type: "string"
        allowed_operators: [eq]
        builder_hidden: true

# Геопошук — окремі «ліві» значення (не атрибути рядка НП у таблиці умов).
geo:
  toponym_precision:
    - region
    - settlement
    - settlement_population
    - settlement_area
    - city_district
  type_labels_uk:
    region: "Область"
    settlement: "Населений пункт"
    settlement_population: "Населення НП"
    settlement_area: "Площа НП"
    city_district: "Район міста"
  operators:
    inside:
      label_uk: "в межах"
    not_inside:
      label_uk: "не в межах"
    in_radius:
      label_uk: "в радіусі"
      extra_value: "radius_km"
