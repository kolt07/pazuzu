services:
  mongodb:
    image: mongo:7
    container_name: pazuzu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - pazuzu_mongo_data:/data/db
    cpus: "${MONGODB_CPUS:-1.0}"
    mem_limit: "${MONGODB_MEM_LIMIT:-1536m}"
    mem_reservation: "${MONGODB_MEM_RESERVATION:-512m}"
    pids_limit: ${MONGODB_PIDS_LIMIT:-512}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pazuzu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pazuzu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pazuzu}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-pazuzu}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - pazuzu_rabbitmq_data:/var/lib/rabbitmq
    cpus: "${RABBITMQ_CPUS:-0.75}"
    mem_limit: "${RABBITMQ_MEM_LIMIT:-1024m}"
    mem_reservation: "${RABBITMQ_MEM_RESERVATION:-384m}"
    pids_limit: ${RABBITMQ_PIDS_LIMIT:-512}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: pazuzu-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - pazuzu_qdrant_data:/qdrant/storage
    cpus: "${QDRANT_CPUS:-1.0}"
    mem_limit: "${QDRANT_MEM_LIMIT:-1024m}"
    mem_reservation: "${QDRANT_MEM_RESERVATION:-256m}"
    pids_limit: ${QDRANT_PIDS_LIMIT:-512}
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 10

  pazuzu-embeddings:
    # ВАЖЛИВО: у TEI 1.5/1.6 був баг `relative URL without a base` під час
    # завантаження `1_Pooling/config.json` (issue #527, фіксено у 1.7+).
    # Тримаємо CPU-тег 1.9 і канонічну форму аргументів `--model-id VALUE`
    # (через пробіл, без `=`) — саме так документує HuggingFace.
    # bge-m3 на CPU під час warmup з'їдає >4GB RAM — при mem_limit=4g Docker OOMKill
    # (exit 137, restart loop). За замовчуванням 8g; при нестачі RAM на хості —
    # EMBEDDINGS_MEM_LIMIT=6g і EMBEDDINGS_MAX_BATCH_TOKENS=4096 у .env.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: pazuzu-embeddings
    restart: unless-stopped
    command:
      - "--model-id"
      - "${EMBEDDINGS_MODEL:-BAAI/bge-m3}"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "${EMBEDDINGS_MAX_BATCH_TOKENS:-4096}"
    volumes:
      - pazuzu_tei_cache:/data
    cpus: "${EMBEDDINGS_CPUS:-2.0}"
    mem_limit: "${EMBEDDINGS_MEM_LIMIT:-10g}"
    mem_reservation: "${EMBEDDINGS_MEM_RESERVATION:-4g}"
    pids_limit: ${EMBEDDINGS_PIDS_LIMIT:-512}
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/localhost/80 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  pazuzu-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pazuzu-app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Bind-mounts code так, щоб docker restart підхоплював зміни без rebuild.
      # Без цього docker compose build потрібен після КОЖНОЇ правки .py-файлу
      # (Dockerfile робить COPY .), і "docker restart" просто перезапускає
      # старий образ — звідси регресія: фікси не доходять у воркер.
      - ./business:/app/business
      - ./config:/app/config:ro
      - ./domain:/app/domain
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./telegram_mini_app:/app/telegram_mini_app
      - ./utils:/app/utils
      - ./main.py:/app/main.py:ro
      - ./data:/app/data
      - ./temp:/app/temp
    cpus: "${PAZUZU_APP_CPUS:-1.5}"
    mem_limit: "${PAZUZU_APP_MEM_LIMIT:-2g}"
    mem_reservation: "${PAZUZU_APP_MEM_RESERVATION:-768m}"
    pids_limit: ${PAZUZU_APP_PIDS_LIMIT:-1024}
    environment:
      PYTHONPATH: /app
      TASK_QUEUE_ENABLED: "true"
      PAZUZU_VAST_ORCHESTRATOR_IN_WORKER: "false"
      # Для повного довідника НП на хості: MONGODB_HOST=host.docker.internal у .env
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pazuzu}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pazuzu}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-pazuzu}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDINGS_ENDPOINT: ${EMBEDDINGS_ENDPOINT:-http://pazuzu-embeddings:80}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
    command: ["python", "main.py"]

  pazuzu-source-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pazuzu-source-worker
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./business:/app/business
      - ./config:/app/config:ro
      - ./domain:/app/domain
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./telegram_mini_app:/app/telegram_mini_app
      - ./utils:/app/utils
      - ./main.py:/app/main.py:ro
      - ./data:/app/data
      - ./temp:/app/temp
    cpus: "${PAZUZU_SOURCE_WORKER_CPUS:-1.25}"
    mem_limit: "${PAZUZU_SOURCE_WORKER_MEM_LIMIT:-1536m}"
    mem_reservation: "${PAZUZU_SOURCE_WORKER_MEM_RESERVATION:-512m}"
    pids_limit: ${PAZUZU_SOURCE_WORKER_PIDS_LIMIT:-768}
    shm_size: ${PAZUZU_SOURCE_WORKER_SHM_SIZE:-1gb}
    environment:
      PYTHONPATH: /app
      TASK_QUEUE_ENABLED: "true"
      OLX_SCRAPER_PHASE1_MAX_THREADS: ${OLX_SCRAPER_PHASE1_MAX_THREADS:-1}
      OLX_SCRAPER_BROWSER_POOL_SIZE: ${OLX_SCRAPER_BROWSER_POOL_SIZE:-0}
      # Для повного довідника НП на хості: MONGODB_HOST=host.docker.internal у .env
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pazuzu}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pazuzu}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-pazuzu}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDINGS_ENDPOINT: ${EMBEDDINGS_ENDPOINT:-http://pazuzu-embeddings:80}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
    command: ["python", "-m", "business.celery_worker_runner", "source_load"]

  pazuzu-llm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pazuzu-llm-worker
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./business:/app/business
      - ./config:/app/config:ro
      - ./domain:/app/domain
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./telegram_mini_app:/app/telegram_mini_app
      - ./utils:/app/utils
      - ./main.py:/app/main.py:ro
      - ./data:/app/data
      - ./temp:/app/temp
    cpus: "${PAZUZU_LLM_WORKER_CPUS:-2.0}"
    mem_limit: "${PAZUZU_LLM_WORKER_MEM_LIMIT:-3g}"
    mem_reservation: "${PAZUZU_LLM_WORKER_MEM_RESERVATION:-1g}"
    pids_limit: ${PAZUZU_LLM_WORKER_PIDS_LIMIT:-1024}
    environment:
      PYTHONPATH: /app
      TASK_QUEUE_ENABLED: "true"
      # Один VllmRuntimeOrchestrator: оренда/idle Vast тільки в цьому контейнері, не в pazuzu-app.
      PAZUZU_VAST_ORCHESTRATOR_IN_WORKER: "true"
      # Для повного довідника НП на хості: MONGODB_HOST=host.docker.internal у .env
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-pazuzu}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-pazuzu}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-pazuzu}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDINGS_ENDPOINT: ${EMBEDDINGS_ENDPOINT:-http://pazuzu-embeddings:80}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
    command: ["python", "-m", "business.celery_worker_runner", "flx_investigation,celery,llm_processing"]

  ngrok:
    profiles:
      - ngrok
    image: ngrok/ngrok:latest
    container_name: pazuzu-ngrok
    restart: unless-stopped
    depends_on:
      - pazuzu-app
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "pazuzu-app:8000"]
    ports:
      - "4040:4040"
    cpus: "${NGROK_CPUS:-0.25}"
    mem_limit: "${NGROK_MEM_LIMIT:-256m}"
    mem_reservation: "${NGROK_MEM_RESERVATION:-128m}"
    pids_limit: ${NGROK_PIDS_LIMIT:-128}

volumes:
  pazuzu_mongo_data:
  pazuzu_rabbitmq_data:
  pazuzu_qdrant_data:
  pazuzu_tei_cache:
